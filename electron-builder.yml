appId: com.shiro.screenshare
productName: Shiro Screen Share
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - node_modules/**/*
  - package.json
  - icon.ico
extraResources:
  - icon.ico
win:
  target:
    - nsis
    - portable
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Shiro - Screen Share
